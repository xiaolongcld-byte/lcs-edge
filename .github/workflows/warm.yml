name: warm
# Render free web services sleep after 15 minutes idle (~40s cold start).
# Strategy: keep ONLY the Singapore edge hot (750 instance-hours/month is a workspace-wide
# budget and two always-on services would exhaust it in ~15 days).
# lcs-edge-us (Oregon) is intentionally left to spin down: it stays as a cold standby that
# wakes on demand in 30-50s when the US_OR node is selected in the client.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping hot edge node
        run: |
          for h in lcs-edge-sg.onrender.com; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "https://$h/") || true
            echo "$h -> $code"
          done
